server {
    listen 80;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    # Static site, not a SPA. `$uri.html` resolves clean URLs, and a miss falls
    # through to the real 404 page rather than silently serving index.html —
    # which is what the previous `try_files ... /index.html` did, making every
    # broken link look like the homepage to both visitors and crawlers.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # A missing page under /es/ answers in Spanish, matching what the
    # .htaccess does on Hostinger.
    location /es/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /es/404/index.html;
    }

    error_page 404 /404.html;

    # Astro fingerprints everything under /_astro/, so it can be cached hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
}
