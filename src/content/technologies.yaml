# Tech stack.
#
# Both locales live in this one file; the loader in src/content.config.ts splits
# it into `<locale>/<key>` entries. `panel` points at the hand-drawn comic
# panel for that technology — the artwork is the point of this section, so keep
# each entry paired with its image.
#
# `order` is ascending and shared across locales so the grid reads the same in
# both languages.

en:
  - key: rust
    name: 'Rust'
    description: 'My default for systems work — robotics drivers, SLAM, and anything that has to run on a Raspberry Pi without a C++ toolchain in the way.'
    panel: ../assets/panels/technologies/rust.png
    category: language
    order: 1

  - key: python
    name: 'Python'
    description: 'Backend services, AI work, automation and the web scraping I have leaned on since my security days.'
    panel: ../assets/panels/technologies/python.png
    category: language
    order: 2

  - key: react-native
    name: 'React Native'
    description: 'Where most of my mobile work lives — e-commerce apps at Publicis, and the utility apps I ship through Grisú.'
    panel: ../assets/panels/technologies/react-native.png
    category: framework
    order: 3

  - key: react
    name: 'React'
    description: 'The web half of the same story: production front ends, design-system components, and the odd internal admin panel.'
    panel: ../assets/panels/technologies/react.png
    category: framework
    order: 4

  - key: fastapi
    name: 'FastAPI'
    description: 'My go-to when a Python service needs to be fast to write, typed, and documented without extra ceremony.'
    panel: ../assets/panels/technologies/fastapi.png
    category: framework
    order: 5

  - key: docker
    name: 'Docker'
    description: 'How everything I build gets reproducible — from a one-off scraper to a monorepo of microservices.'
    panel: ../assets/panels/technologies/docker.png
    category: infra
    order: 6

  - key: aws
    name: 'AWS'
    description: 'Where the production workloads run, alongside CI/CD pipelines and the observability stack that watches them.'
    panel: ../assets/panels/technologies/aws.png
    category: infra
    order: 7

  - key: linux
    name: 'Linux'
    description: 'My daily driver since university, and the environment nearly everything I write ends up running on.'
    panel: ../assets/panels/technologies/linux.png
    category: infra
    order: 8

  - key: mongodb
    name: 'MongoDB'
    description: 'Document storage for the health-interoperability platform, where the shape of a clinical record is anything but fixed.'
    panel: ../assets/panels/technologies/mongodb.png
    category: data
    order: 9

  - key: postgresql
    name: 'PostgreSQL'
    description: 'My default relational database — when the data has a shape worth enforcing, this is where it goes.'
    panel: ../assets/panels/technologies/postgresql.png
    category: data
    order: 10

  - key: apachekafka
    name: 'Apache Kafka'
    description: 'Event streaming for pipelines that cannot afford to lose a message, like the EcoDrive telemetry work.'
    panel: ../assets/panels/technologies/apachekafka.png
    category: data
    order: 11

  - key: graphql
    name: 'GraphQL'
    description: 'Used when a client needs to ask precise questions of a graph of data instead of stitching together five REST calls.'
    panel: ../assets/panels/technologies/graphql.png
    category: data
    order: 12

  - key: mqtt
    name: 'MQTT'
    description: 'The messaging backbone of my IoT work — lightweight enough for a microcontroller, reliable enough to design a system around.'
    panel: ../assets/panels/technologies/mqtt.png
    category: hardware
    order: 13

  - key: raspberrypi
    name: 'Raspberry Pi'
    description: 'The usual target for the robotics work: cross-compile the Rust, ship it to the Pi, watch the lidar spin.'
    panel: ../assets/panels/technologies/raspberrypi.png
    category: hardware
    order: 14

  - key: arduino
    name: 'Arduino'
    description: 'Where the hardware side started — the automated irrigation system that took third place at Expo-Ingenierías ran on one.'
    panel: ../assets/panels/technologies/arduino.png
    category: hardware
    order: 15

  - key: jenkins
    name: 'Jenkins'
    description: 'CI/CD in the places that already run it; GitHub Actions and GitLab CI cover the rest.'
    panel: ../assets/panels/technologies/jenkins.png
    category: tooling
    order: 16

  - key: godot
    name: 'Godot'
    description: 'The engine behind the hyper-casual mobile games I build at Grisú — open source, small, and quick to iterate in.'
    panel: ../assets/panels/technologies/godot.png
    category: tooling
    order: 17

  - key: neovim
    name: 'Neovim'
    description: 'My editor. Configured once, carried everywhere, and faster than reaching for the mouse.'
    panel: ../assets/panels/technologies/neovim.png
    category: tooling
    order: 18

  - key: obsidian
    name: 'Obsidian'
    description: 'Where architecture notes, research and half-formed project ideas live before they turn into code.'
    panel: ../assets/panels/technologies/obsidian.png
    category: tooling
    order: 19

  - key: figma
    name: 'Figma'
    description: 'For UI work — designing the interface before building it, as I did for GameConnect.'
    panel: ../assets/panels/technologies/figma.png
    category: design
    order: 20

